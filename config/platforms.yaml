# Активные платформы
ACTIVE_PLATFORMS:
  kwork:
    url: "https://kwork.ru"
    api_url: "https://api.kwork.ru/"
    protection: "basic"
    method: "mobile_api_jwt"

  freelance_ru:
    url: "https://freelance.ru"
    api_url: "https://freelance.ru/projects/"
    protection: "basic"
    method: "html_search_browser_reply"

  hh_ru:
    url: "https://hh.ru"
    api_url: "https://api.hh.ru/"
    protection: "basic"
    method: "public_api"

# Настройки прокси
PROXY:
  ipv6_rotation: true
  vproxy_url: "http://127.0.0.1:1080"
  session_format: "user-{id}"
  ttl_format: "user-ttl-{count}"

# Настройки безопасности
OPSEC:
  use_commercial_vpn: false
  geo_consistency: true
  time_consistency: true
  browser_fingerprint_rotation: true
