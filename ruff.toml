target-version = "py311"
line-length = 120
exclude = [
    "desktop",
    "scratch",
    "data",
    "scripts/analyze",
    "scripts/debug",
    "tests/manual",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "B",   # flake8-bugbear
]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "E402",    # Several scripts load .env / patch sys.path before local imports
    "F403",    # Package-level wildcard re-exports are used intentionally
]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
