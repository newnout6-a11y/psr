# Минимальный бюджет (в рублях или эквиваленте) (0 = любой)
min_budget: 500

# Максимальный бюджет (в рублях или эквиваленте) (0 = любой)
max_budget: 10000

# Размер страницы при запросах к биржам
per_page: 20

# Максимальный возраст заказа в часах (0 = любой)
max_age_hours: 72

# Максимальное количество предложений (0 = любое)
# Проекты с большим числом откликов — высокая конкуренция
max_proposals: 0

# Минимальный скор заказчика (0-100) для веттинга
# Заказчики ниже этого порога пропускаются — экономия откликов
# 0 = пропускаются все, 30 = средний фильтр, 60 = строгий
min_client_score: 30
